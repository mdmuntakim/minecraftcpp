name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host:
    name: host tests and benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure, build, test
        run: ./build.sh host
      - name: Upload benchmark log
        if: always()
        run: ./build/host/mcc_bench | tee bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: bench.txt

  android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Compile every supported ABI
        run: ./build.sh check

      - name: Build the signed APK
        run: ./build.sh apk

      - name: Verify the APK
        run: |
          set -euo pipefail
          APK=dist/MinecraftCpp-0.1.0-arm64-v8a.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt2" dump badging "$APK" | grep -E \
            "package: name='tw.jjala.minecraftc'|launchable-activity|native-code: 'arm64-v8a'"
          "$BT/apksigner" verify --print-certs "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libminecraftcpp.so'
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftCpp-arm64-v8a
          path: dist/MinecraftCpp-0.1.0-arm64-v8a.apk
