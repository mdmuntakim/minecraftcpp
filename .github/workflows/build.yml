name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host:
    name: host tests and benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure, build, test
        run: ./build.sh host
      - name: Save benchmark log
        if: always()
        run: ./build/host/mcc_bench | tee bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: bench.txt

  android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Use the SDK and NDK that the runner image already provides, and only
      # install what is missing. This avoids the broken "tools" package that
      # some setup-android versions try to fetch.
      - name: Android SDK and NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$(find "$SDK/cmdline-tools" -name sdkmanager 2>/dev/null | head -1 || true)"
          HAVE_NDK="$(find "$SDK/ndk" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -1 || true)"
          HAVE_BT="$(find "$SDK/build-tools" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -1 || true)"
          if [ -z "$HAVE_NDK" ] || [ -z "$HAVE_BT" ] || [ ! -d "$SDK/platforms/android-35" ]; then
            [ -n "$SM" ] || { echo "no sdkmanager and an incomplete SDK" >&2; exit 1; }
            yes | timeout 180 "$SM" --licenses >/dev/null 2>&1 || true
            timeout 900 "$SM" --install "platforms;android-35" \
              "build-tools;35.0.0" "ndk;27.3.13750724"
          fi
          NDK_DIR="$(find "$SDK/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "SDK: $SDK"
          echo "NDK: $NDK_DIR"
          ls "$SDK/platforms" | tail -3

      - name: Compile every supported ABI
        run: ./build.sh check

      - name: Build the signed APK
        run: ./build.sh apk

      - name: Verify the APK
        run: |
          set -euo pipefail
          APK=dist/MinecraftCpp-0.1.0-arm64-v8a.apk
          BT="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" | grep -E \
            "package: name='tw.jjala.minecraftc'|launchable-activity|native-code: 'arm64-v8a'"
          "$BT/apksigner" verify --print-certs "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libminecraftcpp.so'
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftCpp-arm64-v8a
          path: dist/MinecraftCpp-0.1.0-arm64-v8a.apk
